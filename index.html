<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <h1>Fundo Mágico</h1>
        <p class="subtitle">Transforme suas ideias em backgrunds incrivéis com poder da IA. Descreva o que você imagina e veja a magia acontecer.</p>
    </header>
    <main class="container">
        <section class="card mein-card">
            <h2 class="card-header">Descreva o background que você deseja</h2>

            <form action="">
                <textarea id="description"
                    placeholder="Ex: Um gradiente que vai do azul claro para o azul escuro"></textarea>
                <button id="generate-btn" class="btn-magic">Gerar Background Mágico</button>
            </form>
        </section>
        <section id="preview-section" class="preview-card"></section>
        <section id="code-output" class="code-grid">
            <div class="card code-card">
                <h3 class="code-title">Código html</h3>
                <pre id="html-code" class="code-block"></pre>
            </div>
            <div class="card code-card">
                <h3 class="code-title">Código CSS</h3>
                <pre id="css-code" class="code-block"></pre>
            </div>
        </section>
    </main>
</body>

</html>
